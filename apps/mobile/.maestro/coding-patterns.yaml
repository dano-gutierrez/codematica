---
- launchApp:
    clearState: true
- openLink: "codematica://paths/coding-interview-pattern-practice"
- assertVisible: "Coding Interview Pattern Practice"
- scrollUntilVisible:
    element:
      id: mobile-path-node-interview-amazon-two-sum-product-pair
