- tapOn:
    id: mobile-path-node-interview-amazon-two-sum-product-pair
- assertVisible: "Two Sum Product Pair"
- scrollUntilVisible:
    element:
      id: mobile-interview-next-node
    direction: DOWN
- tapOn:
    id: mobile-interview-next-node
- assertVisible: "Validate Parentheses Stream"
- takeScreenshot: coding-pattern-next-question
