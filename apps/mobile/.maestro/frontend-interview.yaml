appId: com.codematica.app
tags:
  - regression
---
- launchApp:
    clearState: true
# Wait for the React navigator before delivering a warm deep link.
- assertVisible:
    id: mobile-nav-learn
- openLink: "codematica://interviews/frontend-practice/dynamic-board?path=frontend-interview-practice"
- scrollUntilVisible:
    element:
      id: mobile-web-next-step
    direction: DOWN
- tapOn:
    id: mobile-web-next-step
- assertVisible: "Step 2 of 4"
- tapOn:
    id: mobile-web-show-solution
- scrollUntilVisible:
    element:
      text: Python
    direction: DOWN
- tapOn: Python
# Use the nearby usage note to distinguish the code heading from the choice button.
- scrollUntilVisible:
    element:
      text: "Time:.*"
    direction: DOWN
    speed: 20
    visibilityPercentage: 100
    centerElement: false
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Save as solution.py and use python3.*"
    direction: DOWN
    speed: 20
    visibilityPercentage: 100
    centerElement: false
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "(?i)^python$"
      below:
        text: "Save as solution.py and use python3.*"
    direction: DOWN
    speed: 20
    visibilityPercentage: 100
    centerElement: false
    timeout: 20000
- assertVisible:
    id: mobile-code-block
- takeScreenshot: frontend-python-dark-code
- scrollUntilVisible:
    element:
      id: mobile-interview-next-node
    direction: DOWN
- tapOn:
    id: mobile-interview-next-node
- scrollUntilVisible:
    element:
      id: mobile-questionnaire-check
    direction: DOWN
    speed: 20
    visibilityPercentage: 100
    centerElement: false
    timeout: 20000
- assertVisible:
    id: mobile-questionnaire-session
- openLink: "codematica://practice/frontend/interview-user-matrix-questionnaire?path=frontend-interview-practice"
# Completion is allowed after reviewing incorrect answers as well. Core tests grade every option.
- repeat:
    times: 8
    commands:
      - scrollUntilVisible:
          element:
            id: mobile-questionnaire-check
          direction: DOWN
      - tapOn:
          id: mobile-questionnaire-check
      - scrollUntilVisible:
          element:
            id: "mobile-questionnaire-(next|finish)"
          direction: DOWN
      - tapOn:
          id: "mobile-questionnaire-(next|finish)"
- scrollUntilVisible:
    element:
      text: Start review feed
    direction: DOWN
    speed: 20
    visibilityPercentage: 100
    centerElement: false
    timeout: 20000
- tapOn: Start review feed
- assertVisible:
    id: mobile-passive-flashcard-feed
- repeat:
    times: 14
    commands:
      - swipe:
          direction: UP
- assertVisible:
    id: mobile-passive-flashcard-list
