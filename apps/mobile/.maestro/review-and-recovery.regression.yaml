- openLink: codematica://paths/breadth-first-and-depth-first-search/flashcards
- assertVisible:
    id: mobile-passive-flashcard-list
- assertNotVisible: Reveal answer
- scrollUntilVisible:
    element:
      id: mobile-passive-flashcard-source-1
    direction: DOWN
    speed: 20
    visibilityPercentage: 100
    centerElement: false
    timeout: 20000
- takeScreenshot: passive-review-scrolled
- tapOn:
    id: mobile-passive-flashcard-source-1
- scrollUntilVisible:
    element:
      id: mobile-markdown-renderer
    direction: DOWN
    speed: 20
    visibilityPercentage: 100
    centerElement: false
    timeout: 20000
- assertVisible:
    id: mobile-markdown-renderer
- openLink: codematica://languages/japanese/vocabulary/good-evening
- assertVisible: good evening
- scrollUntilVisible:
