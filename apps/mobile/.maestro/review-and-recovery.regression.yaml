    direction: DOWN
    speed: 20
    visibilityPercentage: 100
    centerElement: false
    timeout: 20000
- assertVisible: Card 1 of 650
- tapOn:
    id: mobile-japanese-flashcard
- assertVisible: にほん
- assertVisible: Japan
- scrollUntilVisible:
    element:
      text: Next
    direction: DOWN
    speed: 20
    visibilityPercentage: 100
    centerElement: false
    timeout: 20000
