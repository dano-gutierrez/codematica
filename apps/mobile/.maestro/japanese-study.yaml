    direction: DOWN
    speed: 20
    visibilityPercentage: 100
    centerElement: false
    timeout: 20000
- assertVisible:
    id: mobile-japanese-review-skills
- scrollUntilVisible:
    element:
      id: mobile-japanese-review-flashcards
    direction: UP
    speed: 20
    visibilityPercentage: 100
    centerElement: false
    timeout: 20000
- tapOn:
    id: mobile-japanese-review-flashcards
- scrollUntilVisible:
    element:
      id: mobile-japanese-flashcard
    direction: DOWN
    speed: 20
    visibilityPercentage: 100
    centerElement: false
    timeout: 20000
- assertVisible:
    id: mobile-japanese-flashcard
- openLink: codematica://languages/japanese/review/writing
- scrollUntilVisible:
