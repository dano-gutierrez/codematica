appId: com.codematica.app
tags:
  - regression
---
- launchApp:
    clearState: true
# Wait for the React navigator before delivering a warm deep link.
- assertVisible:
    id: mobile-nav-learn
- openLink: codematica://languages/japanese
- scrollUntilVisible:
    element:
      id: mobile-japanese-search-input
    direction: DOWN
    speed: 20
    visibilityPercentage: 100
    centerElement: false
    timeout: 20000
- assertVisible:
    id: mobile-japanese-search-input
- tapOn:
    id: mobile-japanese-search-input
- inputText: "water"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: mobile-japanese-character-japanese-kanji-water
    direction: DOWN
    speed: 20
    visibilityPercentage: 100
    centerElement: false
    timeout: 20000
- assertVisible:
    id: mobile-japanese-results
- tapOn:
    id: mobile-japanese-character-japanese-kanji-water
- scrollUntilVisible:
    element:
      id: mobile-japanese-character-practice
    direction: DOWN
- back
- scrollUntilVisible:
    element:
      id: mobile-japanese-review-link
    direction: UP
- tapOn:
    id: mobile-japanese-review-link
- scrollUntilVisible:
    element:
      id: mobile-japanese-review-flashcards
    direction: DOWN
    speed: 20
    visibilityPercentage: 100
