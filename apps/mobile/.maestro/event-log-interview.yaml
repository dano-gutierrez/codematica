appId: com.codematica.app
tags:
  - regression
---
- launchApp:
    clearState: true
- openLink: "codematica://interviews/real-world/partitioned-event-log?path=partitioned-event-log"
- scrollUntilVisible:
    element:
      id: mobile-web-next-step
    direction: DOWN
- tapOn:
    id: mobile-web-next-step
- assertVisible: "Step 2 of 5"
- tapOn:
    id: mobile-web-show-solution
- scrollUntilVisible:
    element:
      text: Python
    direction: DOWN
- tapOn: Python
- scrollUntilVisible:
    element:
      id: mobile-code-block
    direction: DOWN
- assertVisible:
    id: mobile-code-block
- takeScreenshot: event-log-python-companion
- scrollUntilVisible:
    element:
      id: mobile-interview-next-node
    direction: DOWN
- tapOn:
    id: mobile-interview-next-node
- assertVisible:
    id: mobile-questionnaire-session
- repeat:
    times: 8
    commands:
      - scrollUntilVisible:
          element:
            id: mobile-questionnaire-check
          direction: DOWN
      - tapOn:
          id: mobile-questionnaire-check
      - scrollUntilVisible:
          element:
            id: "mobile-questionnaire-(next|finish)"
          direction: DOWN
      - tapOn:
          id: "mobile-questionnaire-(next|finish)"
- tapOn: Start review feed
- assertVisible:
    id: mobile-passive-flashcard-feed
- repeat:
    times: 14
    commands:
      - swipe:
          direction: UP
- takeScreenshot: event-log-scrolling-review
