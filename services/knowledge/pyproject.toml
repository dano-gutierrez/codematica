[project]
name = "codematica-knowledge"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["graphiti-core==0.30.2", "fastapi>=0.115,<1", "uvicorn>=0.35,<1", "httpx==0.28.1", "sentence-transformers>=5,<6", "mcp>=1.14,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge"]
