name: codematica-knowledge
services:
  neo4j:
    image: neo4j:5.26-community@sha256:d9cfe82983d27f5a75b3aaae8f316d04f9a698a3b7f6103a508f7caf8362f255
    ports:
      - "127.0.0.1:17687:7687"
      - "127.0.0.1:17474:7474"
    environment:
      NEO4J_AUTH: "neo4j/${KNOWLEDGE_NEO4J_PASSWORD:?Run the setup command first}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - graph-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  graph-data:
